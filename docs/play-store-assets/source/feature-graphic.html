<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1024, initial-scale=1" />
    <title>Berkas Feature Graphic</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1024px; height: 500px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        background: #edf3e9;
        color: #f7f7f0;
        font-family: Georgia, "Times New Roman", serif;
      }
      .field {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 77% 45%, rgb(183 216 160 / 20%) 0 2px, transparent 3px) 0 0 / 28px 28px,
          linear-gradient(112deg, #15231a 0%, #203829 54%, #355b3e 100%);
      }
      .field::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 0 57%, rgb(237 243 233 / 7%) 57% 58%, transparent 58%);
      }
      .copy {
        position: absolute;
        z-index: 2;
        left: 72px;
        top: 68px;
        width: 550px;
      }
      .eyebrow {
        margin: 0 0 24px;
        color: #bed8ae;
        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        max-width: 580px;
        font-size: 67px;
        font-weight: 500;
        line-height: 0.98;
        letter-spacing: -3px;
      }
      .sub {
        margin: 28px 0 0;
        color: #dfe8db;
        font-family: Arial, sans-serif;
        font-size: 20px;
        line-height: 1.45;
      }
      .vault {
        position: absolute;
        z-index: 3;
        right: 74px;
        top: 112px;
        width: 265px;
        height: 274px;
      }
      .sheet {
        position: absolute;
        width: 170px;
        height: 190px;
        border: 4px solid #cfddca;
        border-radius: 15px;
        background: #fffef9;
        box-shadow: 0 14px 25px rgb(8 19 12 / 22%);
      }
      .sheet::before,
      .sheet::after {
        content: "";
        position: absolute;
        left: 24px;
        height: 9px;
        border-radius: 9px;
        background: #8ba28f;
      }
      .sheet::before { top: 47px; width: 103px; }
      .sheet::after { top: 72px; width: 75px; opacity: .62; }
      .one { left: 10px; top: 0; transform: rotate(-7deg); }
      .two { right: 2px; top: 11px; transform: rotate(7deg); }
      .folder-back {
        position: absolute;
        left: 6px;
        bottom: 12px;
        width: 252px;
        height: 169px;
        border: 4px solid #8bb279;
        border-radius: 29px;
        background: #79a86b;
      }
      .folder-back::before {
        content: "";
        position: absolute;
        left: 8px;
        top: -39px;
        width: 105px;
        height: 57px;
        border: 4px solid #8bb279;
        border-bottom: 0;
        border-radius: 24px 24px 0 0;
        background: #79a86b;
      }
      .folder-front {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 265px;
        height: 148px;
        border: 4px solid #95bd82;
        border-radius: 32px;
        background: linear-gradient(145deg, #6ca45f, #38734d);
        box-shadow: 0 18px 36px rgb(7 16 10 / 30%);
      }
      .lock {
        position: absolute;
        z-index: 5;
        right: 22px;
        bottom: -17px;
        width: 67px;
        height: 67px;
        border: 3px solid #f2e7b1;
        border-radius: 50%;
        background: #e8d788;
        box-shadow: 0 10px 20px rgb(7 16 10 / 30%);
      }
      .lock::before {
        content: "";
        position: absolute;
        left: 20px;
        top: 12px;
        width: 21px;
        height: 20px;
        border: 5px solid #294b35;
        border-bottom: 0;
        border-radius: 15px 15px 0 0;
      }
      .lock::after {
        content: "";
        position: absolute;
        left: 17px;
        top: 30px;
        width: 29px;
        height: 23px;
        border-radius: 5px;
        background: #294b35;
      }
      .brand {
        position: absolute;
        z-index: 3;
        right: 74px;
        bottom: 47px;
        color: #e9f1e5;
        font-family: Arial, sans-serif;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 5px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="field"></div>
    <section class="copy">
      <p class="eyebrow">Private by default</p>
      <h1>Your important documents, ready.</h1>
      <p class="sub">Encrypted locally. Organized for the moments when proof matters.</p>
    </section>
    <div class="vault" aria-hidden="true">
      <div class="sheet one"></div>
      <div class="sheet two"></div>
      <div class="folder-back"></div>
      <div class="folder-front"></div>
      <div class="lock"></div>
    </div>
    <div class="brand">Berkas</div>
  </body>
</html>
