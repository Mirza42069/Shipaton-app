<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Berkas Project Thumbnail</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 800px; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 48%, rgb(88 118 74 / 12%) 0 240px, transparent 430px),
          #edf3e9;
      }
      img {
        width: 390px;
        height: 390px;
        border-radius: 88px;
        box-shadow:
          0 36px 80px rgb(22 33 25 / 18%),
          0 8px 24px rgb(22 33 25 / 10%);
      }
    </style>
  </head>
  <body>
    <img src="../icon-512.png" alt="Berkas" />
  </body>
</html>
